# Mosquitto MQTT Broker Configuration
# FleetTrack Equipment Tracking POC

# Default listener (MQTT protocol)
listener 1883
protocol mqtt

# WebSocket listener (for browser-based MQTT clients if needed)
listener 9001
protocol websockets

# Allow anonymous connections (POC only - add auth for production)
allow_anonymous true

# Persistence
persistence true
persistence_location /mosquitto/data/

# Logging
log_dest stdout
log_type all
